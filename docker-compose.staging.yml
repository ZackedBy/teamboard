services:
  postgres:
    image: postgres:14-alpine 
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teamboard}
    ports:
      - "5432:5432" 
    # Restart policy: unless-stopped ensures database recovers automatically
    # Critical for data persistence and service availability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-course-project-zada-backend:latest}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-teamboard}
      - DB_PORT=5432
    # Restart policy: unless-stopped will automatically restart the container
    # if it crashes or if Docker daemon restarts, but won't restart if manually stopped
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "80:80"
    env_file:
      - .env
    # Restart policy: unless-stopped ensures frontend recovers automatically
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data: