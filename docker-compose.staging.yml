services:
  postgres:
    image: postgres:14-alpine 
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teamboard}
    ports:
      - "5432:5432" 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-course-project-zada-backend:latest}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - JWT_SECRET=super_long_secret_key_change_me_to_something_random_and_secure_32_chars
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-teamboard}
      - DB_PORT=5432
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://172.16.7.59:3000/api/v1}
    image: ${FRONTEND_IMAGE:-course-project-zada-frontend:latest}
    ports:
      - "80:80"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data: