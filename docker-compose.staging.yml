version: '3.8'

services:
  postgres:
    image: postgres:14-alpine 
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" 
    restart: always

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-course-project-zada-backend:latest}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    restart: always
    depends_on:
      - postgres

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "80:80"
    env_file:
      - .env
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data: