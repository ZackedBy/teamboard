name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["main"]

# Environment variables for easier maintenance
env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  FRONTEND_IMAGE_NAME: 5g00dm04-3008/zada-frontend
  BACKEND_IMAGE_NAME: 5g00dm04-3008/zada-backend

jobs:
  # Job 1: Test the Backend
  backend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint
      - name: Test Backend
        working-directory: ./backend
        run: npm test

  # Job 2: Test the Frontend
  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
      - name: Test Frontend
        working-directory: ./frontend
        run: npm run test:ci

  # Job 3: Building Docker images and pushing them to GHCR
  build:
    runs-on: ubuntu-latest
    needs: [frontend_tests, backend_tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch Code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy staging .env to frontend folder
        working-directory: ./frontend
        run: echo "${{ secrets.FRONTEND_STAGING_ENV }}" > .env

      - name: Build and push Docker Frontend image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}"

      - name: Copy staging .env to backend folder
        working-directory: ./backend
        run: echo "${{ secrets.BACKEND_STAGING_ENV }}" > .env

      - name: Build and push Docker Backend image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}"

  # Job 4: DEPLOYMENT
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenVPN and Rsync
        run: |
          sudo apt update
          sudo apt --assume-yes --no-install-recommends install openvpn openvpn-systemd-resolved rsync

      - name: Setup VPN config
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" > secret.txt
          echo "${{ secrets.VPN_CONFIG }}" | base64 -d > config.ovpn

      - name: Connect VPN
        run: sudo openvpn --config config.ovpn --daemon --log vpn.log

      - name: Wait for a VPN connection
        timeout-minutes: 1
        run: until ping -c1 ${{ secrets.REMOTE_SERVER }}; do sleep 10; done

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.DEPLOY_KEY_PRIVATE }}" | base64 -d > ~/.ssh/id_rsa 
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.REMOTE_SERVER }} >> ~/.ssh/known_hosts

      - name: Create and sync stack configuration
        run: |
          mkdir -p stage_stack
          # ВАЖНО: Вы должны создать этот файл локально
          cp docker-compose.staging.yml stage_stack/docker-compose.yml 

          # Образы тегируются :latest в build, используем их здесь
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest" >> stage_stack/.env
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest" >> stage_stack/.env

          rsync -r stage_stack "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_SERVER }}:./"

      - name: Start containers via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_SERVER }} \
          "
          docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }};
          cd stage_stack;
          docker compose pull;
          docker compose up -d;
          docker compose ps;
          "

      - name: Kill VPN connection
        if: always()
        run: |
          sudo killall openvpn
