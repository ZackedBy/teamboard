# This is the CD/CD pipeline
name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  FRONTEND_IMAGE_NAME: 5g00dm04-3007/null-garden-frontend
  BACKEND_IMAGE_NAME: 5g00dm04-3007/null-garden-backend

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # -----------------------------
  # Job: Test and build frontend & backend code
  # -----------------------------
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Installing a Node LTS version
      - name: Install Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"

      # Installing the node modules for the frontend
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # Running lint check for the frontend
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      # Test that the frontend code builds
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # Installing the node modules for the backend
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # Running the linter
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      # Running backend tests
      - name: Test Backend Code
        working-directory: ./backend
        run: npm run test

  # -----------------------------
  # Job: Build Docker images and push to registry
  # -----------------------------
  build-docker:
    runs-on: ubuntu-latest
    needs: test-and-build # запуск только после успешного теста
    permissions:
      contents: read
      packages: write

    steps:
      # Fetch the code using the checkout action
      - name: Fetch Code
        uses: actions/checkout@v4

      # Installing Node for Docker builds
      - name: Install Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"

      # Setting up the Docker build environment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logging into the GitHub container registry
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Building and pushing the frontend image to the registry
      - name: Build and push Docker Frontend images
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"

      # Building and pushing the backend image to the registry
      - name: Build and push Docker Backend images
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
