name: CI/CD

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: 5g00dm04-3007/null-garden-frontend
  BACKEND_IMAGE_NAME: 5g00dm04-3007/null-garden-backend

jobs:
  # Тесты фронтенда
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  # Тесты бэкенда
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint
      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

  # Сборка и пуш Docker-образов
  build-docker:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test] # запуск только после успешных тестов
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
