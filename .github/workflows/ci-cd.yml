# This is the CD/CD pipeline
name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  FRONTEND_IMAGE_NAME: 5g00dm04-3007/zada-frontend
  BACKEND_IMAGE_NAME: 5g00dm04-3007/zada-backend

jobs:
  # -----------------------------
  # Job 1: Test and build frontend & backend code
  # -----------------------------
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node для фронтенда
      - name: Install Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"

      # Frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # Lint frontend
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      # Build frontend
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # Backend dependencies
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # Lint backend
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      # Test backend
      - name: Test Backend Code
        working-directory: ./backend
        run: npm run test

  # -----------------------------
  # Job 2: Build Docker images and push to registry
  # -----------------------------
  build-docker:
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      # Node для сборки
      - name: Install Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"

      # Docker Buildx и QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в GHCR
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сборка и пуш фронтенда
      - name: Build and push Docker Frontend images
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"

      # Сборка и пуш бэкенда
      - name: Build and push Docker Backend images
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
