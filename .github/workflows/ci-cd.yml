name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["main"]

# Environment variables for easier maintenance
env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  FRONTEND_IMAGE_NAME: 5g00dm04-3008/zada-frontend
  BACKEND_IMAGE_NAME: 5g00dm04-3008/zada-backend
  # 1. DEPLOYMENT VARIABLES (по гайду: используй secrets для IP/user)
  # Добавь в GitHub Secrets: REMOTE_SERVER=193.167.167.59, REMOTE_USER=deploy

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Job 1: Test the Backend
  backend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint
      - name: Test Backend
        working-directory: ./backend
        run: npm test

  # Job 2: Test the Frontend
  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
      - name: Test Frontend
        working-directory: ./frontend
        run: npm run test:ci

  # Job 3: Building Docker images and pushing them to GHCR
  build:
    runs-on: ubuntu-latest
    needs: [frontend_tests, backend_tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch Code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- START: .env File Creation (Per Instructions) ---
      # Create .env for Frontend (Vite)
      - name: Copy staging .env to frontend folder
        working-directory: ./frontend
        # This secret must contain VITE_API_URL=http://localhost:3000 (или staging)
        run: echo "${{ secrets.FRONTEND_STAGING_ENV }}" > .env

      # Create .env for Backend (Node.js)
      - name: Copy staging .env to backend folder
        working-directory: ./backend
        # This secret must contain NODE_ENV=production + DB vars
        run: echo "${{ secrets.BACKEND_STAGING_ENV }}" > .env
      # --- END: .env File Creation ---

      - name: Build and push Docker Frontend image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"

      - name: Build and push Docker Backend image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"

  # 4. UPDATED JOB: DEPLOYMENT (с VPN, rsync, deploy user)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # VPN Setup
      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      # Setup config (расширь, если certs нужны — см. ниже)
      - name: Setup VPN config
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" > secret.txt
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn
          # Если TUNI требует certs: echo "${{ secrets.CA_CRT }}" > ca.crt  # Добавь secrets
          # echo "${{ secrets.USER_CRT }}" > user.crt
          # echo "${{ secrets.USER_KEY }}" > user.key

      # Connect с action (лучше daemon: auto-handles restart/ping)
      - name: Connect VPN
        uses: kota65535/github-openvpn-connect-action@v2
        with:
          config_file: config.ovpn
          password: ${{ secrets.VPN_PASSWORD }}
          # Если certs: ca: ${{ secrets.CA_CRT }}, cert: ${{ secrets.USER_CRT }}, key: ${{ secrets.USER_KEY }}
          # username: ${{ secrets.OVPN_USERNAME }}  # Если TUNI user-based

      # Wait + DEBUG: Логи, роуты, IP-check
      - name: Wait for VPN and Debug
        timeout-minutes: 3 # Больше времени
        run: |
          # Проверь VPN logs
          echo "=== VPN LOGS ==="
          tail -n 50 vpn.log || echo "No vpn.log"
          # Проверь роуты (ищи конфликты 10.1.0.0 или 172.16.x)
          echo "=== IP ADDR ==="
          ip addr show
          echo "=== ROUTES ==="
          ip route show
          # Ping приватный IP? (замени на твой из TUNI panel/status.tamk.cloud)
          echo "=== PING PRIVATE? (use 172.16.x.x if available) ==="
          ping -c 3 172.16.4.1 || echo "Private ping fail"
          # Твой публичный ping
          until ping -c 1 ${{ secrets.REMOTE_SERVER }}; do
            echo "Waiting for VPN... (retry in 5s)";
            sleep 5;
          done
          echo "VPN UP!"
          # Check external IP change (через VPN?)
          curl -s ifconfig.me || echo "No curl"

      # Остальные шаги (SSH, rsync, deploy) — как раньше
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY_PRIVATE }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.REMOTE_SERVER }} >> ~/.ssh/known_hosts

      # Rsync для stack (docker-compose + .env с имейджами)
      - name: Install rsync
        run: sudo apt install -y rsync

      - name: Create and sync stage_stack
        run: |
          mkdir -p stage_stack
          cp docker-compose.staging.yml stage_stack/docker-compose.yml  # Твой файл
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest" >> stage_stack/.env
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest" >> stage_stack/.env
          rsync -avz --delete stage_stack/ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_SERVER }}:stage_stack/

      # Deploy via SSH (используем appleboy/ssh-action для удобства, но с env)
      - name: Deploy via SSH and Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_SERVER }}
          username: ${{ secrets.REMOTE_USER }} # deploy
          key: ${{ secrets.DEPLOY_KEY_PRIVATE }} # Уже base64, action сам decode? Нет — используй raw ssh ниже, или decode в setup
          # Лучше raw ssh для точности (замени на run: ниже)
          # timeout: 120s
          script: |
            # Login to GHCR
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            # Deploy
            cd /home/${{ secrets.REMOTE_USER }}/stage_stack
            docker compose down || true  # Безопасно
            docker compose pull
            docker compose up -d
            docker compose ps
            docker compose logs --tail=10  # Для отладки

      # Альтернатива: Raw SSH вместо appleboy (если key issues)
      # - name: Deploy via raw SSH
      #   run: |
      #     ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_SERVER }} "
      #       echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin;
      #       cd /home/${{ secrets.REMOTE_USER }}/stage_stack;
      #       docker compose down || true;
      #       docker compose pull;
      #       docker compose up -d;
      #       docker compose ps;
      #     "

      # Cleanup VPN
      - name: Kill VPN
        if: always()
        run: sudo pkill openvpn || true
