name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["main"]

# Environment variables for easier maintenance
env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  FRONTEND_IMAGE_NAME: 5g00dm04-3008/zada-frontend
  BACKEND_IMAGE_NAME: 5g00dm04-3008/zada-backend
  # 1. DEPLOYMENT VARIABLES (по гайду: используй secrets для IP/user)
  # Добавь в GitHub Secrets: REMOTE_SERVER=193.167.167.59, REMOTE_USER=deploy

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Job 1: Test the Backend
  backend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint
      - name: Test Backend
        working-directory: ./backend
        run: npm test

  # Job 2: Test the Frontend
  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
      - name: Test Frontend
        working-directory: ./frontend
        run: npm run test:ci

  # Job 3: Building Docker images and pushing them to GHCR
  build:
    runs-on: ubuntu-latest
    needs: [frontend_tests, backend_tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch Code
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- START: .env File Creation (Per Instructions) ---
      # Create .env for Frontend (Vite)
      - name: Copy staging .env to frontend folder
        working-directory: ./frontend
        # This secret must contain VITE_API_URL=http://localhost:3000 (или staging)
        run: echo "${{ secrets.FRONTEND_STAGING_ENV }}" > .env

      # Create .env for Backend (Node.js)
      - name: Copy staging .env to backend folder
        working-directory: ./backend
        # This secret must contain NODE_ENV=production + DB vars
        run: echo "${{ secrets.BACKEND_STAGING_ENV }}" > .env
      # --- END: .env File Creation ---

      - name: Build and push Docker Frontend image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"

      - name: Build and push Docker Backend image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"

  # 4. UPDATED JOB: DEPLOYMENT (с VPN, rsync, deploy user)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # VPN Setup
      - name: Install OpenVPN
        run: sudo apt update && sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Setup VPN config
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" > secret.txt
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn

      - name: Connect VPN
        run: |
          sudo openvpn --config config.ovpn --daemon --persist-tun --persist-key --log /tmp/vpn.log
          sleep 15  # Больше времени на init

      # Debug: Logs + TCP-test (игнор ping)
      - name: Debug VPN & Test TCP
        timeout-minutes: 3
        run: |
          echo "=== VPN LOGS ==="
          tail -n 50 /tmp/vpn.log || echo "Check journal: journalctl -u openvpn"
          echo "=== TUN0 STATUS ==="
          ip addr show tun0
          echo "=== RELEVANT ROUTES (172.16) ==="
          ip route show | grep 172.16
          # Ping gateway (должен пройти)
          echo "=== PING GATEWAY (10.120.0.13) ==="
          ping -c 3 10.120.0.13 || echo "Gateway fail (check .ovpn)"
          # Ping private VM (может block, но ok)
          echo "=== PING PRIVATE VM (172.16.7.59) ==="
          ping -c 3 172.16.7.59 || echo "ICMP blocked (normal for TUNI) - check TCP"
          # TCP test: nc to SSH (ключевой!)
          echo "=== TCP TEST: SSH PORT 22 ==="
          nc -zv -w10 172.16.7.59 22 && echo "✅ SSH PORT REACHABLE! Proceed." || echo "❌ SSH unreachable - firewall?"
          # Bonus: Если nc ok, quick SSH test (no auth)
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes deploy@172.16.7.59 "echo 'SSH works!'" 2>&1 || echo "Auth fail expected, but connect ok?"

      # SSH Setup
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY_PRIVATE }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 172.16.7.59 >> ~/.ssh/known_hosts || echo "Keyscan fail - ignore"

      # Rsync + Deploy (private IP)
      - name: Install rsync
        run: sudo apt install -y rsync

      - name: Create and sync stage_stack
        run: |
          mkdir -p stage_stack
          cp docker-compose.staging.yml stage_stack/docker-compose.yml
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest" >> stage_stack/.env
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest" >> stage_stack/.env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> stage_stack/.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> stage_stack/.env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> stage_stack/.env
          echo "${{ secrets.BACKEND_STAGING_ENV }}" >> stage_stack/.env
          echo "${{ secrets.FRONTEND_STAGING_ENV }}" >> stage_stack/.env
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" stage_stack/ ${{ secrets.REMOTE_USER }}@172.16.7.59:stage_stack/

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=3 ${{ secrets.REMOTE_USER }}@172.16.7.59 "
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin;
          cd /home/${{ secrets.REMOTE_USER }}/stage_stack;
          docker compose down || true;
          docker compose pull;
          docker compose up -d;
          sleep 30;
          docker compose ps;
          docker compose logs --tail=20;
          "

      - name: Kill VPN
        if: always()
        run: sudo pkill openvpn || true
